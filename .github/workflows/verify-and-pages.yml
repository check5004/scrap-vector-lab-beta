name: Verify beta and deploy isolated Pages
on:
  push:
    branches: [main, "beta/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Verify pinned beta source and version
        run: node scripts/verify-release.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-fixtures.txt
      - run: pip install -r requirements-fixtures.txt
      - run: python scripts/generate_samples.py
      - run: npm ci
      - run: npm run assets
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Build and run actual container
        run: |
          docker build --build-arg SCRAP_SOURCE_COMMIT=$SCRAP_SOURCE_COMMIT -t scrap-vector-lab:ci .
          docker run -d --name scrap-smoke -p 8080:8080 scrap-vector-lab:ci
          trap 'docker logs scrap-smoke; docker rm -f scrap-smoke' EXIT
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/ > /tmp/app.html && break || sleep 1; done
          grep -q 'Scrap Vector Lab' /tmp/app.html
          curl -fsS http://127.0.0.1:8080/print/dictionary.json | grep -q 'DICT_4X4_50'
          curl -fsSI http://127.0.0.1:8080/vendor/ort-wasm-simd-threaded.mjs | grep -i 'content-type: application/javascript'
          APP_URL=http://127.0.0.1:8080 PLAYWRIGHT_HTML_OUTPUT_DIR=playwright-report-container npm run test:browser -- --project=chromium --output=test-results-container
          curl -fsS http://127.0.0.1:8080/models/u2netp.onnx -o /tmp/model.onnx
          echo '309c8469258dda742793dce0ebea8e6dd393174f89934733ecc8b14c76f4ddd8  /tmp/model.onnx' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-results
          path: |
            playwright-report/
            test-results/
            playwright-report-container/
            test-results-container/
          retention-days: 7
      - uses: actions/upload-pages-artifact@v3
        if: github.repository == 'check5004/scrap-vector-lab-beta' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: dist
  deploy:
    if: github.repository == 'check5004/scrap-vector-lab-beta' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
